name: HYUNK Panel - node status

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: hyunk-panel-node-status
  cancel-in-progress: false

jobs:
  check-node-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PANEL_URL: https://panel.wangstore.web.id
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate scheduler secret
        run: test -n "$CRON_SECRET" || (echo "::error::GitHub Actions secret CRON_SECRET belum diatur" && exit 1)
      - name: Run node status check
        run: >-
          curl --silent --show-error --fail --retry 3 --retry-delay 5
          --max-time 240
          -H "Authorization: Bearer ${CRON_SECRET}"
          "${PANEL_URL}/api/cron/node-status"
